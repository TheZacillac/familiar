# Familiar configuration
# Copy to ~/.familiar/config.toml and edit to taste.
# Environment variables override these values (see .env.example).

[model]
# Two-tier model system: "fast" handles most queries, "power" is called
# when the fast model decides it needs backup.
# Format: provider:model (e.g., ollama:gemma4:e4b, openai:gpt-4o)
fast = "ollama:gemma4:e4b"
power = "ollama:gemma4:31b"

# Fallback if "fast" is not set (backward compatible):
# default = "ollama:nemotron-3-nano:latest"

[model.ollama]
base_url = "http://localhost:11434"

[storage]
# Base directory for Familiar data (database, exports, etc.)
data_dir = "~/.familiar"
# SQLite database filename (relative to data_dir)
db_name = "familiar.db"
# Directory for /export output
export_dir = "~/.familiar/exports"

[agent]
# Thread pool size for parallel tool calls.
# Seer's Rust core releases the GIL during I/O, so real parallelism is achieved.
max_workers = 12

# How much skill documentation to merge into the system prompt.
#   "full"    — SKILL.md plus every reference/*.md (~30k tokens with the
#               default skill set — needs a 128k+ context model).
#   "minimal" — only top-level SKILL.md files. Required for local
#               8k–32k context models such as the default Ollama build.
skill_docs_level = "full"

# Fall back to a seer.rdap_ip lookup for IPs the local hosting-prefix
# table doesn't recognise. Authoritative but adds a network round-trip
# (~100ms) per uncached unknown IP. Results are cached per process.
rdap_hosting_lookup = false

[tracing]
# LangSmith observability (pip install -e ".[tracing]")
enabled = true
api_key = ""  # set your LangSmith API key here
project = "familiar"

# Catppuccin Mocha palette — override individual keys to restyle the REPL.
[theme]
info = "#8caaee"            # Blue
warning = "#e5c890"         # Yellow
error = "#e78284"           # Red
success = "#a6d189"         # Green
prompt = "bold #a6d189"     # Green (bold)
title = "bold #ca9ee6"      # Mauve (bold)
border = "#babbf1"          # Lavender
muted = "#a5adce"           # Subtext0
spinner = "#81c8be"         # Teal
accent = "#f4b8e4"          # Pink
peach = "#ef9f76"           # Peach
sky = "#99d1db"             # Sky
