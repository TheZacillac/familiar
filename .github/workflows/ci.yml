name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install "ruff==0.15.16"
          ruff check src/

  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 guards the requires-python lower bound; 3.14 matches local dev.
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4

      # seer/tome (PyO3) and scrolls aren't on PyPI — build them from their
      # sibling repos so familiar's pins resolve against local installs.
      - uses: actions/checkout@v4
        with:
          repository: TheZacillac/seer
          path: .deps/seer
      - uses: actions/checkout@v4
        with:
          repository: TheZacillac/tome
          path: .deps/tome
      - uses: actions/checkout@v4
        with:
          repository: TheZacillac/scrolls
          path: .deps/scrolls

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .deps/seer
            .deps/tome

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./.deps/seer/seer-py ./.deps/tome/tome-py ./.deps/scrolls
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q
